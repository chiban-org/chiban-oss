services:
  postgres:
    image: imresamu/postgis:16-3.5
    environment:
      POSTGRES_USER: chiban
      POSTGRES_PASSWORD: chiban
      POSTGRES_DB: chiban
    ports: ["5434:5432"]
    volumes:
      - chiban-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiban"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGIN:-http://localhost:3000}
      MINIO_ROOT_USER: chiban
      MINIO_ROOT_PASSWORD: chiban-dev-secret
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - chiban-minio:/data

  stripe-mock:
    image: stripe/stripe-mock:v0.206.0
    ports:
      - "12111:12111"

  mailpit:
    image: axllent/mailpit@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  chiban-pg:
  chiban-minio:
