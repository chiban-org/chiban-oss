x-app-environment: &app-environment
  BASE_URL: ${BASE_URL}
  DATABASE_URL: postgres://chiban:${POSTGRES_PASSWORD}@postgres:5432/chiban
  S3_ENDPOINT: http://garage:3900
  S3_PUBLIC_ENDPOINT: https://s3.${APP_DOMAIN}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  SMTP_URL: ${SMTP_URL}
  MAIL_FROM: ${MAIL_FROM}
  CHIBAN_ACTIVE_KEY_ID: ${CHIBAN_ACTIVE_KEY_ID}
  CHIBAN_SECRET_KEYS: ${CHIBAN_SECRET_KEYS}
  USPS_CLIENT_ID: ${USPS_CLIENT_ID:-}
  USPS_CLIENT_SECRET: ${USPS_CLIENT_SECRET:-}
  LOG_LEVEL: ${LOG_LEVEL:-}
  ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
  HEALTH_HEARTBEAT_URL: ${HEALTH_HEARTBEAT_URL:-}
  PAGER_EVENTS_URL: ${PAGER_EVENTS_URL:-}
  PAGER_ROUTING_KEY: ${PAGER_ROUTING_KEY:-}
  S3_REGION: ${S3_REGION:-}
  S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-}
  ENABLE_SIMULATED_PAYMENTS: ${ENABLE_SIMULATED_PAYMENTS:-}
  STRIPE_API_BASE: ${STRIPE_API_BASE:-}
  CHIBAN_DEMO_MODE: ${CHIBAN_DEMO_MODE:-}
  CHIBAN_DEMO_RESET_AT: ${CHIBAN_DEMO_RESET_AT:-}
  CHIBAN_DEMO_MAIL_SINK_HOSTS: ${CHIBAN_DEMO_MAIL_SINK_HOSTS:-}
  CHIBAN_DEMO_OVERLAY_FILE: ${CHIBAN_DEMO_OVERLAY_FILE:-}
  BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}

services:
  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
      - garage

  app:
    image: ${CHIBAN_IMAGE}
    restart: unless-stopped
    environment:
      <<: *app-environment
      CHIBAN_IMAGE_REF: ${CHIBAN_IMAGE}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    image: ${CHIBAN_IMAGE}
    restart: unless-stopped
    command: ["node", "dist/worker.mjs"]
    environment:
      <<: *app-environment
      CHIBAN_IMAGE_REF: ${CHIBAN_IMAGE}
      HEALTH_DISK_PATHS: /monitor/pg,/monitor/garage
    volumes:
      - pgdata:/monitor/pg:ro
      - garagedata:/monitor/garage:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: ${CHIBAN_IMAGE}
    restart: "no"
    command: ["node", "dist/migrate.mjs"]
    environment:
      <<: *app-environment
      CHIBAN_IMAGE_REF: ${CHIBAN_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
      storageinit:
        condition: service_completed_successfully

  postgres:
    image: ${POSTGIS_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chiban
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiban"]
      interval: 5s
      timeout: 3s
      retries: 20

  garage:
    image: ${GARAGE_IMAGE}
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-access-key"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  storageinit:
    image: ${CHIBAN_IMAGE}
    restart: "no"
    command: ["node", "dist/storage-init.mjs"]
    environment:
      <<: *app-environment
      CHIBAN_IMAGE_REF: ${CHIBAN_IMAGE}
      GARAGE_ADMIN_ENDPOINT: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    depends_on:
      garage:
        condition: service_healthy

volumes:
  pgdata:
  garagedata:
  caddydata:
  caddyconfig:
